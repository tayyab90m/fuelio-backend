version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fitness-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitness_dashboard
    ports:
      - "5432:5432"
    volumes:
      - fitness_dashboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitness_dashboard_pgdata:
